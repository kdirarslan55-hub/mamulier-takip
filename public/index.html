<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:14px;}
.header{background:#fff;padding:12px 16px;border-bottom:1px solid #e0e0d8;position:sticky;top:0;z-index:10;}

.role-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

.tabs{display:flex;background:#fff;border-bottom:1px solid #e0e0d8;}

.urun-detay{font-size:11px;color:#888;margin-top:2px;line-height:1.4;}

.b-iste{background:#fff8e1;color:#e65100;}
.b-tukendi{background:#f3e5f5;color:#7b1fa2;}

.vc-iste{background:#fff3e0;color:#e65100;}
.vc-iade{background:#fdecea;color:#c62828;}
.vc-pas{background:#f0f0f0;color:#888;}

.vbtn.sel-iade{background:#fdecea;border-color:#ef5350;color:#c62828;}
.vbtn.sel-pas{background:#f0f0f0;border-color:#bbb;color:#666;}

.ozet-wrap{padding:12px 14px;}
.ozet-sec{margin-bottom:14px;}
.ozet-sec-title{font-size:11px;font-weight:700;margin-bottom:7px;padding:5px 8px;border-radius:6px;}

.ozet-img-ph{width:38px;height:50px;border-radius:4px;background:#f0f0f0;flex-shrink:0;}
.ozet-info{flex:1;}
.ozet-ad{font-size:12px;font-weight:600;margin-bottom:2px;}
.ozet-detay{font-size:10px;color:#888;margin-bottom:4px;}
.ozet-chips{display:flex;gap:4px;flex-wrap:wrap;}

.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;display:inline-block;margin-left:6px;vertical-align:middle;}

let currentRole='Şura', votes={}, currentFilter='hepsi';

async function loadVotes(){
  try{const r=await fetch('/api/votes');votes=await r.json();document.getElementById('sync-dot').className='sync-dot ok';renderAll();}
  catch(e){document.getElementById('sync-dot').className='sync-dot';}
}
async function sendVote(idx,oy){
  if(currentRole==='Yönetici')return;
  if(!votes[idx])votes[idx]={};
  const prev=votes[idx][currentRole];
  if(prev===oy){delete votes[idx][currentRole];await fetch('/api/vote',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({urun_idx:idx,kisi:currentRole})});}
  else{votes[idx][currentRole]=oy;await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urun_idx:idx,kisi:currentRole,oy})});}
  renderAll();
}
function setRole(btn,role){currentRole=role;document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderAll();}
function setTab(btn,tab){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+tab).classList.add('active');if(tab==='ozet')renderOzet();}
function setFilter(btn,f){currentFilter=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderAll();}
function imgEl(idx,cls){const src=IMGS[idx];if(src)return `<img src="${src}" class="${cls}" loading="lazy">`;return `<div class="${cls}-ph">👗</div>`;}
function renderAll(){
  let html='';
  URUNLER.forEach((u,i)=>{
    if(currentFilter!=='hepsi'&&u.durum!==currentFilter)return;
    const myVote=votes[i]&&votes[i][currentRole];
    const isYon=currentRole==='Yönetici';
    const badge=u.durum==='tukendi'?'<span class="badge b-tukendi">✓ Tükendi</span>':'<span class="badge b-iste">⬆ Stokta</span>';
    let chips='';
    if(votes[i]&&Object.keys(votes[i]).length){chips='<div class="votes-row">';Object.entries(votes[i]).forEach(([k,v])=>{const cls=v==='iste'?'vc-iste':v==='iade'?'vc-iade':'vc-pas';chips+=`<span class="vc ${cls}">${v==='iste'?'⬆':v==='iade'?'↩':'—'} ${k}</span>`;});chips+='</div>';}
    let btns='';
    if(!isYon)btns=`<div class="btn-row"><button class="vbtn${myVote==='iste'?' sel-iste':''}" onclick="sendVote(${i},'iste')">⬆ İste</button><button class="vbtn${myVote==='iade'?' sel-iade':''}" onclick="sendVote(${i},'iade')">↩ İade</button><button class="vbtn${myVote==='pas'?' sel-pas':''}" onclick="sendVote(${i},'pas')">— Pas</button></div>`;
    html+=`<div class="urun-card">${imgEl(i,'urun-img')}<div class="urun-body"><div class="urun-top"><div><div class="urun-ad">${u.urun} — ${u.renk}</div><div class="urun-detay">${u.not}</div></div>${badge}</div>${chips}${btns}</div></div>`;
  });
  document.getElementById('urun-list').innerHTML=html||'<div class="empty">Ürün bulunamadı.</div>';
}
function renderOzet(){
  let isteH='',iadeH='';
  URUNLER.forEach((u,i)=>{
    if(!votes[i]||!Object.keys(votes[i]).length)return;
    const isteK=Object.entries(votes[i]).filter(([,v])=>v==='iste').map(([k])=>k);
    const iadeK=Object.entries(votes[i]).filter(([,v])=>v==='iade').map(([k])=>k);
    const img=imgEl(i,'ozet-img');
    if(isteK.length)isteH+=`<div class="ozet-item">${img}<div class="ozet-info"><div class="ozet-ad">${u.urun} — ${u.renk}</div><div class="ozet-detay">${u.not}</div><div class="ozet-chips">${isteK.map(k=>`<span class="vc vc-iste">⬆ ${k}</span>`).join('')}</div></div></div>`;
    if(iadeK.length)iadeH+=`<div class="ozet-item">${img}<div class="ozet-info"><div class="ozet-ad">${u.urun} — ${u.renk}</div><div class="ozet-chips">${iadeK.map(k=>`<span class="vc vc-iade">↩ ${k}</span>`).join('')}</div></div></div>`;
  });
  document.getElementById('ozet-iste').innerHTML=isteH||'<div class="empty">Henüz oy yok.</div>';
  document.getElementById('ozet-iade').innerHTML=iadeH||'<div class="empty">Henüz oy yok.</div>';
}
function whatsapp(){
  let msg='🗂 *MA MULİER TOPLANTI ÖZETİ*\n\n';let iV=false,iadeV=false;
  URUNLER.forEach((u,i)=>{if(!votes[i])return;const iste=Object.entries(votes[i]).filter(([,v])=>v==='iste').map(([k])=>k);const iade=Object.entries(votes[i]).filter(([,v])=>v==='iade').map(([k])=>k);if(iste.length){if(!iV){msg+='⬆ *İSTENECEKLER*\n';iV=true;}msg+=`• ${u.urun} ${u.renk} — ${iste.join(', ')}\n`;}if(iade.length){if(!iadeV){msg+='\n↩ *İADE*\n';iadeV=true;}msg+=`• ${u.urun} ${u.renk} — ${iade.join(', ')}\n`;}});
  window.open('https://wa.me/?text='+encodeURIComponent(msg));
}
loadVotes();setInterval(loadVotes,15000);
</script>
